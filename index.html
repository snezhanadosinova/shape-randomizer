<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>REEVO Shape Lab</title>
  </head>
  <body>
    <h1 class="header">REEVO Shape Lab</h1>
    <p class="description">
      Watch randomly generated shapes fall under gravity. Click or tap an empty
      area to create a shape, or a shape to remove it.
    </p>
    <div class="flex-section">
      <div>
        <span>Number of current shapes:</span>
        <span id="currentNumber" class="number">0</span>
      </div>
      <div>
        <span>Surface area occupied by shapes:</span>
        <span class="number">not implemented</span>
      </div>
    </div>
    <main id="scene"></main>

    <div class="flex-section">
      <div>
        <span> Number of shapes per second: </span>
        <span class="number">1</span>
      </div>
      <div><span>Gravity value:</span> <span class="number">180</span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
